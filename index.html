<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو جدو الغاوي - موشن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f6c95c;--cream:#f8efd3;--green:#1b4a37;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#040705;font-family:"Cairo",Tahoma,Arial,sans-serif;color:#eef2ec}
#cam{position:fixed;inset:0;overflow:hidden;touch-action:pan-y;background:radial-gradient(ellipse at 50% 40%,#0b2118 0,#040705 70%)}
#w{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.3s cubic-bezier(.7,0,.2,1)}
.c,.d{position:absolute}
#w.f .c:not(.on)::after{opacity:.72}
.c{width:320px;height:420px;border-radius:20px;display:flex;flex-direction:column;border:1px solid #ffffff1a;background:linear-gradient(160deg,#17463a,#0b2a20);color:var(--cream);cursor:pointer}
.c::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#040705;opacity:0;transition:opacity .9s;pointer-events:none}
.c.lt{background:var(--cream);color:var(--green)}
.h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.h h2{margin:0;font-family:"Reem Kufi",Tahoma,sans-serif;font-size:34px;line-height:1.1;color:var(--gold)}
.lt .h h2{color:var(--green)}
.tag{font-size:13px;border:1px solid currentColor;border-radius:99px;padding:0 10px;opacity:.75}
.l{flex:1;overflow:hidden;touch-action:none}
.in{padding:4px 20px 24px}
.l::-webkit-scrollbar{display:none}
.r{display:flex;align-items:baseline;gap:6px;padding:4px 0;font-weight:600;font-size:17px;line-height:1.35}
.r i{flex:1;border-bottom:1.5px dotted currentColor;opacity:.3;transform:translateY(-4px)}
.r b{background:var(--gold);color:var(--green);border-radius:6px;padding:0 8px}
.sub{font-size:14px;margin:12px 0 2px;color:var(--gold)}
.lt .sub{color:#4f6f5a}
table{width:100%;border-collapse:collapse;text-align:center;font-size:15px;font-weight:600}
th{color:var(--gold);padding:4px 2px;border-bottom:1px solid #ffffff33}
.lt th{color:#4f6f5a;border-bottom-color:#1b4a3744}
td{padding:5px 2px;border-bottom:1px dotted #ffffff33}
td:first-child,th:first-child{text-align:right}
td+td{color:var(--gold);font-weight:700}
.lt td+td{color:var(--green)}
.sph{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f9a6c,#0d3526 55%,#04100b 80%);box-shadow:inset -10px -12px 24px #f59a3aaa}
.pill{background:var(--gold);color:#101a14;font-family:"Reem Kufi",Tahoma,sans-serif;font-size:40px;padding:6px 38px;border-radius:99px;white-space:nowrap}
.dot{width:26px;height:26px;border-radius:50%}
#nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;font-size:14px}
#nav img{height:36px;background:var(--cream);border-radius:8px;padding:2px 8px;display:block}
#nav div{display:flex;align-items:center;gap:8px}
#nav button{font:inherit;font-size:14px;color:#dfe8e0;background:#ffffff14;border:1px solid #ffffff33;border-radius:99px;padding:2px 14px;cursor:pointer}
#nav button:focus-visible{outline:2px solid var(--gold)}
#cap{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 18px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;overflow:hidden}
#ct{display:inline-flex;align-items:flex-start;gap:6px;font-family:"Reem Kufi",Tahoma,sans-serif;font-size:min(16vw,140px);line-height:1.15;color:#f4f1e6}
#ct sup{font-size:.28em;color:var(--gold);margin-top:.5em;font-family:"Cairo",Tahoma,sans-serif}
@media (prefers-reduced-motion:reduce){#w{transition:none}}
</style>
</head>
